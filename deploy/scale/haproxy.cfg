# Seal-aware load balancer for N timika replicas (compose, Swarm).
#
# Two pools over the same replicas, discovered through Docker DNS:
#   ready — only UNSEALED instances (health 200). All data traffic goes here.
#   live  — any instance whose process answers, sealed or not. Serves the UI
#           and the seal-lifecycle endpoints, so you can see status, init and
#           unseal (with "all instances") even while everything is sealed.
#
# TIMIKA_TARGET is the DNS name that resolves to every replica:
#   compose: the service name (`timika`) · Swarm: `tasks.timika`

global
    log stdout format raw local0

defaults
    mode http
    log global
    option httplog
    # Real client IP for timika's sign-in rate limiting and audit log
    # (timika trusts it with TRUST_X_FORWARDED_FOR=true).
    option forwardfor
    timeout connect 3s
    timeout client 60s
    timeout server 60s
    # Web-terminal WebSockets and streamed gRPC responses stay open.
    timeout tunnel 8h
    # A replica that just died is still in the pool until its health check fails
    # (≤4s). Retry such requests on another replica — only on connection failure,
    # so a request that reached a server is never replayed (safe for writes).
    retries 2
    retry-on conn-failure
    option redispatch 1

resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 5s
    hold obsolete 10s

frontend api
    # Clear-text HTTP/1.1 (UI, gRPC-Web, WebSocket) and HTTP/2 with prior
    # knowledge (native gRPC clients) on the same port — HAProxy detects h2.
    bind :8200
    acl lifecycle path_beg /v1/sys/health /timika.v1.SysService/Health /timika.v1.SysService/GetSealStatus /timika.v1.SysService/Init /timika.v1.SysService/Unseal /timika.v1.SysService/Instances
    acl api path_beg /v1/ /timika.v1.
    # Native gRPC must reach timika over HTTP/2; everything else (gRPC-Web,
    # the terminal WebSocket) stays HTTP/1.1.
    acl grpc req.hdr(content-type) -m beg application/grpc
    acl grpc_web req.hdr(content-type) -m beg application/grpc-web
    use_backend ready_h2 if grpc !grpc_web !lifecycle
    use_backend live_h2 if grpc !grpc_web lifecycle
    use_backend ready if api !lifecycle
    default_backend live

backend ready
    balance roundrobin
    option httpchk GET /v1/sys/health?standbyok=true
    http-check expect status 200
    default-server inter 2s fall 2 rise 1
    server-template t 16 "${TIMIKA_TARGET}:8200" check resolvers docker init-addr none

backend live
    balance roundrobin
    option httpchk GET /v1/sys/health?standbyok=true&sealedok=true&uninitok=true
    http-check expect status 200
    default-server inter 2s fall 2 rise 1
    server-template t 16 "${TIMIKA_TARGET}:8200" check resolvers docker init-addr none

# Same pools, HTTP/2 to the server (native gRPC). Health checks stay HTTP/1.1.
backend ready_h2
    balance roundrobin
    option httpchk GET /v1/sys/health?standbyok=true
    http-check expect status 200
    default-server inter 2s fall 2 rise 1 proto h2 check-proto h1
    server-template t 16 "${TIMIKA_TARGET}:8200" check resolvers docker init-addr none

backend live_h2
    balance roundrobin
    option httpchk GET /v1/sys/health?standbyok=true&sealedok=true&uninitok=true
    http-check expect status 200
    default-server inter 2s fall 2 rise 1 proto h2 check-proto h1
    server-template t 16 "${TIMIKA_TARGET}:8200" check resolvers docker init-addr none
