{{- if eq .Values.backend "raft" }}
{{- if eq (mod (int .Values.replicas) 2) 0 }}
{{- fail "replicas must be odd (1, 3, 5): an even number of Raft voters adds no fault tolerance" }}
{{- end }}
{{- $fullname := include "timika.fullname" . }}
{{- $scheme := include "timika.scheme" . }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $fullname }}
  labels: {{- include "timika.labels" . | nindent 4 }}
spec:
  serviceName: {{ $fullname }}-internal
  replicas: {{ .Values.replicas }}
  # Start all pods at once: they come up sealed and wait for operators anyway.
  podManagementPolicy: Parallel
  selector:
    matchLabels: {{- include "timika.selector" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "timika.selector" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "timika.serviceAccountName" . }}
      securityContext:
        runAsUser: 10001
        runAsNonRoot: true
        fsGroup: 10001
      {{- if ne .Values.antiAffinity "none" }}
      affinity:
        podAntiAffinity:
          {{- if eq .Values.antiAffinity "hard" }}
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels: {{- include "timika.selector" . | nindent 18 }}
          {{- else }}
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels: {{- include "timika.selector" . | nindent 20 }}
          {{- end }}
      {{- end }}
      containers:
        - name: timika
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - { name: api, containerPort: 8200 }
            - { name: cluster, containerPort: 8201 }
          env:
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - { name: STORAGE, value: raft }
            - { name: RAFT_NODE_ID, value: "$(POD_NAME)" }
            - { name: RAFT_PATH, value: /data }
            - { name: BIND_ADDR, value: "0.0.0.0:8200" }
            - { name: CLUSTER_BIND_ADDR, value: "0.0.0.0:8201" }
            - name: API_ADDR
              value: "{{ $scheme }}://$(POD_NAME).{{ $fullname }}-internal.{{ .Release.Namespace }}.svc:8200"
            - name: CLUSTER_ADDR
              value: "{{ $scheme }}://$(POD_NAME).{{ $fullname }}-internal.{{ .Release.Namespace }}.svc:8201"
            - name: RAFT_RETRY_JOIN
              value: {{ include "timika.retryJoin" . | quote }}
            - { name: RAFT_SNAPSHOT_THRESHOLD, value: {{ .Values.raft.snapshotThreshold | quote }} }
            - { name: RAFT_TRAILING_LOGS, value: {{ .Values.raft.trailingLogs | quote }} }
            {{- include "timika.tlsEnv" . | nindent 12 }}
            {{- include "timika.sealEnv" . | nindent 12 }}
            {{- include "timika.logEnv" . | nindent 12 }}
            {{- include "timika.loginEnv" . | nindent 12 }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          # Ready = unsealed (leader or follower). Sealed/uninitialized pods get
          # no client traffic; operators reach them with `kubectl port-forward`.
          {{- with .Values.login.captcha.existingSecret }}
          envFrom:
            - secretRef: { name: {{ . }} }
          {{- end }}
          readinessProbe:
            httpGet:
              path: /v1/sys/health?standbyok=true
              port: api
              scheme: {{ upper $scheme }}
            periodSeconds: 5
            failureThreshold: 2
          # Alive = the process answers at all, sealed or not.
          livenessProbe:
            httpGet:
              path: /v1/sys/health?standbyok=true&sealedok=true&uninitok=true
              port: api
              scheme: {{ upper $scheme }}
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - { name: data, mountPath: /data }
            {{- include "timika.secretMounts" . | nindent 12 }}
          {{- with .Values.resources }}
          resources: {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        {{- include "timika.secretVolumes" . | nindent 8 }}
        {{- if not .Values.logging.persistence.enabled }}
        - name: logs
          emptyDir: {}
        {{- end }}
  volumeClaimTemplates:
    {{- if .Values.logging.persistence.enabled }}
    - metadata:
        name: logs
      spec:
        accessModes: [ReadWriteOnce]
        {{- if .Values.logging.persistence.storageClass }}
        storageClassName: {{ .Values.logging.persistence.storageClass }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.logging.persistence.size }}
    {{- end }}
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        {{- if .Values.storage.storageClass }}
        storageClassName: {{ .Values.storage.storageClass }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.storage.size }}
{{- end }}
