{{- $fullname := include "timika.fullname" . }}
# Client-facing service: only READY (= unsealed) pods. Any of them serves any
# request — followers forward to the Raft leader.
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}
  labels: {{- include "timika.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector: {{- include "timika.selector" . | nindent 4 }}
  ports:
    - { name: api, port: {{ .Values.service.port }}, targetPort: api }
{{- if eq .Values.backend "raft" }}
---
# Headless service for peer-to-peer traffic: stable per-pod DNS names, and
# published even while pods are NOT ready — sealed nodes must still be able to
# find each other to join and catch up.
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-internal
  labels: {{- include "timika.labels" . | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector: {{- include "timika.selector" . | nindent 4 }}
  ports:
    - { name: api, port: 8200, targetPort: api }
    - { name: cluster, port: 8201, targetPort: cluster }
{{- end }}
