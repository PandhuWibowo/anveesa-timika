{{- if .Values.serviceAccount.create }}
# For AWS IRSA: annotate with eks.amazonaws.com/role-arn so pods get KMS
# credentials via web identity (SEAL_TYPE=awskms picks them up automatically).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "timika.serviceAccountName" . }}
  labels: {{- include "timika.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
