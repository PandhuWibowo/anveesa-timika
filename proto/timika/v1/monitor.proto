syntax = "proto3";

package timika.v1;

import "google/protobuf/empty.proto";
import "timika/v1/automation.proto";

// Server monitoring, in the spirit of Beszel — but with no agent to install:
// timika reads metrics over SSH, with the credentials and pinned host key it
// already has for the server. CPU, memory, disk, network, load, temperature,
// Docker containers and failed systemd units, with history and alerts.
//
// Anyone who may use a server (a grant) can see its metrics; everything else
// is admin only.
service MonitorService {
  // Monitored systems with their latest numbers. Admins also get the servers
  // that are not monitored yet (`available`).
  rpc ListSystems(google.protobuf.Empty) returns (ListSystemsResponse);
  // One system: latest numbers, disks, containers, failed units, rules and
  // history for `range`.
  rpc GetSystem(GetSystemRequest) returns (SystemDetail);
  // Start or stop monitoring servers (`account` empty = the first account).
  rpc SetMonitoring(SetMonitoringRequest) returns (google.protobuf.Empty);
  // This system's own alert rules, or back to the defaults.
  rpc SetSystemAlerts(SystemAlerts) returns (google.protobuf.Empty);
  rpc GetSettings(google.protobuf.Empty) returns (MonitorSettings);
  rpc SaveSettings(SaveMonitorSettings) returns (MonitorSettings);
  rpc TestNotifier(MonitorTestRequest) returns (TestNotifierResponse);

  // Every container on every monitored server you may see.
  rpc ListContainers(google.protobuf.Empty) returns (ListContainersResponse);
  // The last lines of a container's output (`docker logs`). Admin only: logs
  // are read as the monitoring account and often hold secrets.
  rpc ContainerLogs(ContainerLogsRequest) returns (ContainerLogsResponse);
  // start · stop · restart. Admin only.
  rpc ContainerAction(ContainerActionRequest) returns (ContainerActionResponse);
  // One container's latest numbers and history for `range`.
  rpc GetContainerUsage(ContainerUsageRequest) returns (ContainerUsage);
  // What talks to what: servers, the processes listening on them, containers,
  // and every connection seen between them (and to the outside), plus what
  // nginx is configured to forward. Only the servers you may see.
  rpc GetMap(MapRequest) returns (NetworkMap);
  // How the map is detected: from the VMs only, or with the cloud providers'
  // APIs as well (keys under SourceService). Admin only.
  rpc SetMapMethod(MapMethod) returns (MapMethod);
}

message MapMethod {
  // vm · api
  string method = 1;
}

// A cloud your servers say they run in.
message DetectedCloud {
  // tencent · aws · gcp · azure
  string provider = 1;
  repeated string regions = 2;
  repeated string servers = 3;
  // A key for it is set up (Cloud API).
  bool connected = 4;
}

message MapRequest {
  // Connections seen within: 1h · 24h (default) · 7d · 30d
  string range = 1;
}

message MapPort {
  uint32 port = 1;
  // tcp · udp
  string proto = 2;
  // The address it is bound to, or how a container's port is reached.
  string bind = 3;
  // Only reachable from the server (or container network) itself.
  bool local = 4;
}

message MapNode {
  // s:<server> · p:<server>:<process> · c:<server>:<container> · x:<address> · internet ·
  // g:<source> · i:<source>:<item>
  string id = 1;
  // server · process · container · external · internet ·
  // cloud · cluster (a source's card) · vm · lb · nat · node · ingress · service · workload
  string kind = 2;
  string label = 3;
  // The server it is on (empty for external / internet).
  string asset = 4;
  string server = 5;
  // server: its host · container: its image
  string detail = 6;
  repeated string addresses = 7;
  repeated MapPort ports = 8;
  // server: pending · up · down · container: running · exited …
  string state = 9;
  // A container's compose project.
  string project = 10;
  // external: an address on the internet (not a private network).
  // lb · service · ingress · vm: reachable from the internet.
  bool public = 11;
  // The card it is drawn in: a server (s:<id>) or a source (g:<id>).
  string group = 12;
  // More to show, as "Label: value".
  repeated string attrs = 13;
  // A zone or region; a namespace.
  string scope = 14;
}

message MapEdge {
  string from = 1;
  string to = 2;
  // The port on the receiving side.
  uint32 port = 3;
  // A connection was seen / nginx is configured to forward there.
  bool observed = 4;
  bool declared = 5;
  string from_process = 6;
  string to_process = 7;
  string first_seen = 8;
  string last_seen = 9;
  // Readings it was seen in.
  uint32 seen = 10;
  // Most connections (or distinct clients) at once.
  uint32 peak = 11;
  // "published port 8080 → 3000"
  string note = 12;
  // nginx sites that forward along this edge.
  repeated string sites = 13;
  bool tls = 14;
  // What says so when it is configured: nginx · AWS · Kubernetes …
  string declared_by = 15;
}

message NetworkMap {
  repeated MapNode nodes = 1;
  repeated MapEdge edges = 2;
  string collected_at = 3;
  // What could not be seen, and why.
  repeated string notes = 4;
  // vm (the VMs only) · api (and the cloud providers' APIs)
  string method = 5;
  repeated DetectedCloud detected = 6;
}

message ContainerUsageRequest {
  string asset = 1;
  string name = 2;
  // 1h · 6h · 24h · 7d · 30d · 90d
  string range = 3;
}

message ContainerUsage {
  string system = 1;
  // Absent when the container is gone from the last reading.
  optional Container container = 2;
  // Unix seconds; the series' values line up with these.
  repeated int64 times = 3;
  ContainerSeries series = 4;
  uint32 step = 5;
}

message ContainerRow {
  string asset = 1;
  string system = 2;
  Container container = 3;
}

message ListContainersResponse {
  repeated ContainerRow containers = 1;
}

message ContainerLogsRequest {
  string asset = 1;
  string name = 2;
  // Lines from the end (default 200, at most 2000).
  uint32 tail = 3;
}

message ContainerLogsResponse {
  string text = 1;
  bool truncated = 2;
}

message ContainerActionRequest {
  string asset = 1;
  string name = 2;
  string action = 3;
}

message ContainerActionResponse {
  bool ok = 1;
  string output = 2;
}

// One container's history, aligned with SystemDetail.times (NaN = no reading).
message ContainerSeries {
  string name = 1;
  repeated double cpu = 2;
  // Bytes.
  repeated double mem = 3;
  // Bytes per second.
  repeated double rx = 4;
  repeated double tx = 5;
  repeated double io_read = 6;
  repeated double io_write = 7;
  repeated double pids = 8;
}

message Latest {
  // Percent (0–100); absent when the server doesn't report it.
  optional double cpu = 1;
  optional double mem = 2;
  uint64 mem_used = 3;
  uint64 mem_total = 4;
  optional double swap = 5;
  optional double disk = 6;
  uint64 disk_used = 7;
  uint64 disk_total = 8;
  // Bytes per second.
  optional double rx = 9;
  optional double tx = 10;
  optional double load1 = 11;
  optional double load5 = 12;
  optional double load15 = 13;
  // Hottest sensor, °C.
  optional double temp = 14;
  optional double io_read = 15;
  optional double io_write = 16;
  uint64 uptime = 17;
  string os = 18;
  string kernel = 19;
  string cpu_model = 20;
  uint32 cpus = 21;
  // When this was read.
  string time = 22;
}

message Disk {
  string device = 1;
  string mount = 2;
  uint64 total = 3;
  uint64 used = 4;
}

message Container {
  string name = 1;
  // running · exited · paused · restarting …
  string state = 2;
  optional double cpu = 3;
  uint64 mem = 4;
  string image = 5;
  // "Up 3 hours (healthy)"
  string status = 6;
  string ports = 7;
  // healthy · unhealthy · starting, or empty
  string health = 8;
  uint64 mem_limit = 9;
  // Bytes per second.
  optional double rx = 10;
  optional double tx = 11;
  // docker · podman
  string runtime = 12;
  // Disk I/O, bytes per second.
  optional double io_read = 13;
  optional double io_write = 14;
  // Processes inside.
  optional uint32 pids = 15;
  // Bytes written on top of the image, and image + that.
  uint64 size_rw = 16;
  uint64 size_total = 17;
}

message AlertRule {
  // status · cpu · mem · swap · disk · rx · tx · load · temp
  string metric = 1;
  // Percent, bytes per second, load, °C. Ignored for `status`.
  double threshold = 2;
  // Average over this many minutes (for `status`: down this long).
  uint32 minutes = 3;
}

message Firing {
  string metric = 1;
  string since = 2;
  optional double value = 3;
}

message System {
  string asset = 1;
  string name = 2;
  string host = 3;
  repeated string tags = 4;
  // The account used to read metrics.
  string account = 5;
  // pending · up · down
  string status = 6;
  // Since when it is up / down.
  optional string since = 7;
  optional string error = 8;
  optional Latest latest = 9;
  // CPU % of the last samples, for the sparkline.
  repeated double spark = 10;
  repeated Firing firing = 11;
  uint32 containers_running = 12;
  uint32 containers_total = 13;
  uint32 failed_units = 14;
  // The last reading that failed (also after it recovered), and when.
  optional string last_error = 15;
  optional string last_error_at = 16;
}

message Available {
  string asset = 1;
  string name = 2;
  string host = 3;
  repeated string tags = 4;
  repeated string accounts = 5;
}

message ListSystemsResponse {
  repeated System systems = 1;
  repeated Available available = 2;
  // Seconds between readings.
  uint32 interval = 3;
}

message GetSystemRequest {
  string asset = 1;
  // 1h · 6h · 24h · 7d · 30d · 90d
  string range = 2;
}

message Series {
  string metric = 1;
  // One value per timestamp; NaN = no reading.
  repeated double values = 2;
}

message SystemDetail {
  System system = 1;
  repeated Disk disks = 2;
  repeated Container containers = 3;
  repeated string failed_unit_names = 4;
  // The rules in force and whether they are the defaults.
  repeated AlertRule rules = 5;
  bool default_rules = 6;
  // Unix seconds.
  repeated int64 times = 7;
  repeated Series series = 8;
  // Seconds between points of this range.
  uint32 step = 9;
  repeated ContainerSeries container_series = 10;
}

message SetMonitoringRequest {
  repeated string assets = 1;
  bool enabled = 2;
  string account = 3;
}

message SystemAlerts {
  string asset = 1;
  bool use_defaults = 2;
  repeated AlertRule rules = 3;
}

message MonitorSettings {
  repeated AlertRule defaults = 1;
  repeated Notifier notifiers = 2;
  uint32 interval = 3;
}

message SaveMonitorSettings {
  repeated AlertRule defaults = 1;
  repeated NotifierInput notifiers = 2;
}

message MonitorTestRequest {
  NotifierInput notifier = 1;
}
