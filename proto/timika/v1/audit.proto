syntax = "proto3";

package timika.v1;

import "google/protobuf/empty.proto";
import "google/protobuf/struct.proto";

// The audit trail, read back from this instance's audit file (admin only).
// Each API call is one event (its request + response entries joined); terminal
// sessions are events too. Values and passwords are never in the log — only
// who, what (the RPC and a non-secret target such as a secret path or user
// name), from where, and the outcome.
service AuditService {
  // Newest first. Page with `before_seq` = the previous page's `next_before_seq`.
  rpc ListEvents(ListEventsRequest) returns (ListEventsResponse);
  // Check the hash chain of this instance's audit files.
  rpc Verify(google.protobuf.Empty) returns (VerifyResponse);
}

message ListEventsRequest {
  // Default 100, max 500.
  uint32 limit = 1;
  optional uint64 before_seq = 2;
  // Exact user (display name), case-insensitive.
  string user = 3;
  // Free text over action, target, user, address and error.
  string query = 4;
  // "", "ok" or "error".
  string outcome = 5;
  // "", "secrets", "signin", "users", "servers", "sessions", "system".
  string category = 6;
  // Also show routine reads (session checks/renewals, list views, polling).
  bool include_routine = 7;
  // Only events about this server (bastion asset id): its configuration,
  // access grants, logins tested, terminals opened and sessions.
  string server = 8;
}

message AuditEvent {
  uint64 seq = 1;
  string time = 2;
  string id = 3;
  // "call" or "session".
  string kind = 4;
  // e.g. "KvService/Write", "GET /v1/bastion/connect", "session live".
  string action = 5;
  optional string user = 6;
  repeated string policies = 7;
  optional string remote_addr = 8;
  // What was acted on: a secret path, a user, a server…
  optional string target = 9;
  bool ok = 10;
  // gRPC status code (0 = OK) or HTTP status.
  int32 code = 11;
  optional string error = 12;
  uint64 duration_ms = 13;
  // Session details (asset, account, bytes recorded…), for kind = session.
  google.protobuf.Struct details = 14;
  string instance = 15;
}

message ListEventsResponse {
  repeated AuditEvent events = 1;
  optional uint64 next_before_seq = 2;
  string instance = 3;
  // false when this instance writes no local audit file (syslog only / off).
  bool stored = 4;
}

message VerifyResponse {
  bool ok = 1;
  uint64 entries = 2;
  repeated string chain_starts = 3;
  repeated string problems = 4;
}
